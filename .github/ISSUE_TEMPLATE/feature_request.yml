name: Feature request
description: Suggest an improvement or a new feature for the template.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The template is fully static (no backend), so features need to work at build time or in the browser.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who needs it, and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen? Mockups or examples from other sites help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.

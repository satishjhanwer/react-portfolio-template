name: Bug report
description: Something in the template doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first. For security issues, follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Open the command palette with Ctrl+K
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Site (UI, layout, animation)
        - Accessibility
        - Themes or colours
        - Translations
        - Print résumé
        - PWA or offline
        - Setup script (npm run setup / icons)
        - Build, tests or tooling
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Windows 11
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: For setup, build or test issues (`node -v`).
      placeholder: v24.10.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or other context
      description: Theme (`?theme=`), language (`?lang=`), accessibility preferences, console errors…
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I can reproduce this on the latest `main`.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var themes = ["indigo", "sunset", "arctic"];
        function chosen() {
          var q = new URLSearchParams(location.search).get("theme");
          if (themes.indexOf(q) !== -1) return q;
          try {
            var s = localStorage.getItem("theme");
            if (themes.indexOf(s) !== -1) return s;
          } catch (e) {}
          return null;
        }
        function applyTheme() {
          var forced = chosen();
          var h = new Date().getHours();
          var t = forced !== null ? forced : h < 8 ? "arctic" : h < 16 ? null : "sunset";
          if (t) document.documentElement.setAttribute("data-theme", t);
          else document.documentElement.removeAttribute("data-theme");
        }
        applyTheme();
        function scheduleNext() {
          var h = new Date().getHours();
          var next = h < 8 ? 8 : h < 16 ? 16 : 24;
          var now = new Date();
          var ms = (next * 3600 - (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds())) * 1000 + 200;
          setTimeout(function () {
            applyTheme();
            scheduleNext();
          }, ms);
        }
        scheduleNext();
      })();
    </script>
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("a11y-prefs") || "{}");
          var r = document.documentElement;
          if (p.textSize === "115" || p.textSize === "130") r.setAttribute("data-text-size", p.textSize);
          if (p.highContrast === true) r.setAttribute("data-contrast", "high");
          if (p.readableFont === true) r.setAttribute("data-font", "readable");
          if (p.reduceMotion === true) r.setAttribute("data-motion", "reduce");
          if (p.systemCursor === true) r.setAttribute("data-cursor", "system");
          if (p.underlineLinks === true) r.setAttribute("data-links", "underline");
          if (["protanopia", "deuteranopia", "tritanopia", "achromatopsia"].indexOf(p.colorVision) !== -1)
            r.setAttribute("data-vision", p.colorVision);
        } catch (e) {}
      })();
    </script>
